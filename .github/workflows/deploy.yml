name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to your default branch if it's not main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the Node.js version appropriate for your project

      - name: Install dependencies
        run: npm install # Or 'bun install' if you prefer bun

      - name: Build project
        run: npm run build # Or 'bun run build' if you prefer bun

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # The directory containing your built project

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
